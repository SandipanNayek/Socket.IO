<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat App</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh}
.container{width:420px;height:650px;background:#1e293b;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.4)}
.header{background:linear-gradient(45deg,#7c3aed,#9333ea);color:#fff;padding:15px;text-align:center;font-size:18px;font-weight:bold}
#messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 14px;border-radius:12px;max-width:70%;font-size:14px;animation:fade .2s ease}
.me{background:#7c3aed;color:#fff;align-self:flex-end}
.other{background:#334155;color:#fff;align-self:flex-start}
.time{font-size:10px;opacity:.6;margin-top:3px}
.input-area{display:flex;padding:10px;background:#020617}
#message{flex:1;padding:10px;border:none;border-radius:10px;outline:none}
#sendBtn{margin-left:8px;padding:10px 14px;border:none;background:#7c3aed;color:#fff;border-radius:10px;cursor:pointer}
#sendBtn:hover{background:#6d28d9}
#typing{font-size:12px;color:#94a3b8;padding-left:10px;height:18px}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="container">
<div class="header">💬 Chat App</div>
<div id="messages"></div>
<div id="typing"></div>
<div class="input-area">
<input type="text" id="message" placeholder="Type a message...">
<button id="sendBtn">Send</button>
</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const username=prompt("Enter your name")||"User";
const sendBtn=document.getElementById('sendBtn');
const messageInput=document.getElementById('message');
const messagesDiv=document.getElementById('messages');
const typingDiv=document.getElementById('typing');

socket.emit('join',username);

socket.on('message',(data)=>{
const msg=document.createElement('div');
msg.classList.add('msg');
msg.classList.add(data.user===username?'me':'other');
msg.innerHTML=`<div>${data.text}</div><div class="time">${data.time}</div>`;
messagesDiv.appendChild(msg);
messagesDiv.scrollTop=messagesDiv.scrollHeight;
});

sendBtn.addEventListener('click',()=>{
const text=messageInput.value.trim();
if(!text)return;
const time=new Date().toLocaleTimeString();
socket.emit('chatMessage',{user:username,text,time});
messageInput.value='';
});

messageInput.addEventListener('keypress',(e)=>{
if(e.key==='Enter')sendBtn.click();
});

messageInput.addEventListener('input',()=>{
socket.emit('typing',username);
});

socket.on('typing',(user)=>{
if(user!==username){
typingDiv.innerText=`${user} is typing...`;
setTimeout(()=>typingDiv.innerText='',1000);
}
});
</script>
</body>
</html>
